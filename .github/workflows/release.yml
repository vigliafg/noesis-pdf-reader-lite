name: build-releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --clean \
            --noconfirm \
            --name NoesisPDFReaderLite \
            --collect-all pymupdf4llm \
            main.py

      - name: Package artifact
        shell: bash
        env:
          BASE: NoesisPDFReaderLite-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              mv "dist/NoesisPDFReaderLite.exe" "$BASE.exe"
              ;;
            Linux)
              mv "dist/NoesisPDFReaderLite" "$BASE"
              ;;
            macOS)
              # .app is a directory bundle → wrap it in a .dmg
              hdiutil create -volname "NoesisPDFReaderLite" \
                -srcfolder "dist/NoesisPDFReaderLite.app" \
                -ov -format UDZO "$BASE.dmg"
              ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoesisPDFReaderLite-${{ matrix.name }}
          path: NoesisPDFReaderLite-${{ matrix.name }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
