name: build-releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download tessdata (fast, 14 languages)
        shell: bash
        run: |
          mkdir -p ocr/tessdata
          for l in eng ita fra deu spa por nld pol rus chi_sim jpn kor ara tur; do
            curl -sL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${l}.traineddata" \
              -o "ocr/tessdata/${l}.traineddata"
          done
          du -sh ocr/tessdata

      - name: Stage Tesseract (Windows)
        shell: bash
        if: runner.os == 'Windows'
        run: |
          choco install tesseract -y --no-progress
          TESS="/c/Program Files/Tesseract-OCR"
          cp "$TESS/tesseract.exe" ocr/
          cp "$TESS"/libtesseract*.dll "$TESS"/liblept*.dll ocr/ || true
          ls -la ocr

      - name: Stage Tesseract (macOS)
        shell: bash
        if: runner.os == 'macOS'
        run: |
          brew install tesseract dylibbundler
          PREFIX="$(brew --prefix tesseract)"
          mkdir -p ocr/lib
          cp "$PREFIX/bin/tesseract" ocr/
          # Reloca l'intera closure di dylib in ocr/lib con install name
          # @executable_path/lib (i path Homebrew assoluti non esistono sui
          # Mac degli utenti).
          dylibbundler -b -of -x ocr/tesseract -d ocr/lib -p @executable_path/lib
          ls -la ocr ocr/lib

      - name: Build with PyInstaller
        shell: bash
        run: |
          ICON=""
          case "$RUNNER_OS" in
            Windows) ICON="--icon assets/noesispdf.ico" ;;
            macOS)   ICON="--icon assets/noesispdf.icns" ;;
          esac
          case "$RUNNER_OS" in
            Windows)
              EXTRA=(
                --add-binary "ocr/tesseract.exe;."
                --add-binary "ocr/libtesseract*.dll;."
                --add-binary "ocr/liblept*.dll;."
                --add-data "ocr/tessdata;tessdata"
              )
              ;;
            macOS)
              EXTRA=(
                --add-binary "ocr/tesseract:."
                --add-binary "ocr/lib:lib"
                --add-data "ocr/tessdata:tessdata"
              )
              ;;
          esac
          pyinstaller \
            --onefile \
            --windowed \
            --clean \
            --noconfirm \
            --name NoesisPDFReaderLite \
            $ICON \
            --collect-all pymupdf4llm \
            --collect-data pymupdf \
            "${EXTRA[@]}" \
            main.py

      - name: Package artifact
        shell: bash
        env:
          BASE: NoesisPDFReaderLite-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              mv "dist/NoesisPDFReaderLite.exe" "$BASE.exe"
              ;;
            macOS)
              # .app is a directory bundle → wrap it in a .dmg
              hdiutil create -volname "NoesisPDFReaderLite" \
                -srcfolder "dist/NoesisPDFReaderLite.app" \
                -ov -format UDZO "$BASE.dmg"
              ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoesisPDFReaderLite-${{ matrix.name }}
          path: NoesisPDFReaderLite-${{ matrix.name }}*
          if-no-files-found: error

  linux-appimage:
    name: linux-x86_64-appimage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download tessdata (fast, 14 languages)
        shell: bash
        run: |
          mkdir -p ocr/tessdata
          for l in eng ita fra deu spa por nld pol rus chi_sim jpn kor ara tur; do
            curl -sL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${l}.traineddata" \
              -o "ocr/tessdata/${l}.traineddata"
          done
          du -sh ocr/tessdata

      - name: Stage Tesseract (Linux)
        shell: bash
        run: |
          sudo apt-get update -qq
          # Le dipendenze (liblept*, libarchive, libcurl...) vengono risolte
          # automaticamente da apt: non pinnare nomi di pacchetto che variano
          # tra versioni di Ubuntu (es. libleptonica-1.82.0 non esiste su 24.04).
          sudo apt-get install -y -qq tesseract-ocr libtesseract5
          mkdir -p ocr/lib
          cp /usr/bin/tesseract ocr/
          # Closure ldd: copia le dipendenze non-glibc in ocr/lib (le librerie
          # di sistema già presenti sui target non vanno incluse).
          for lib in $(ldd /usr/bin/tesseract | awk '/=> \//{print $3}'); do
            case "$lib" in
              *libc.so*|*libm.so*|*libstdc++*|*libgcc*|*libdl*|*libpthread*|*librt*|*ld-linux*) ;;
              *) cp -L "$lib" ocr/lib/ ;;
            esac
          done
          ls -la ocr ocr/lib

      - name: Build with PyInstaller
        shell: bash
        run: |
          # PyInstaller uses ';' as the source:dest separator on Windows
          # and ':' on Linux/macOS.
          case "$RUNNER_OS" in
            Windows) SEP=';' ;;
            *)       SEP=':' ;;
          esac
          pyinstaller \
            --onefile \
            --windowed \
            --clean \
            --noconfirm \
            --name NoesisPDFReaderLite \
            --collect-all pymupdf4llm \
            --collect-data pymupdf \
            --add-binary "ocr/tesseract${SEP}." \
            --add-binary "ocr/lib${SEP}lib" \
            --add-data "ocr/tessdata${SEP}tessdata" \
            main.py

      - name: Package AppImage
        shell: bash
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"

          # self-contained binary
          cp "dist/NoesisPDFReaderLite" "$APPDIR/usr/bin/NoesisPDFReaderLite"
          chmod +x "$APPDIR/usr/bin/NoesisPDFReaderLite"

          # icon (256x256 PNG, icona reale dell'app)
          cp assets/noesispdf-256.png "$APPDIR/NoesisPDFReaderLite.png"

          # desktop entry
          cat > "$APPDIR/NoesisPDFReaderLite.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Noesis PDF Reader Lite
          Exec=NoesisPDFReaderLite
          Icon=NoesisPDFReaderLite
          Categories=Office;Viewer;
          Comment=PDF reader with adaptive layout engine and translation
          Terminal=false
          EOF

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/NoesisPDFReaderLite" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool (run without FUSE via --appimage-extract-and-run)
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run \
            "$APPDIR" "NoesisPDFReaderLite-x86_64.AppImage"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoesisPDFReaderLite-linux-x86_64-appimage
          path: NoesisPDFReaderLite-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
