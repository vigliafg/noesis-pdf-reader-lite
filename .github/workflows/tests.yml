name: tests

# Harness gate: runs on every push/PR so "CI verde" means something.
# Runs the whole app + workflow harness (tools/harness.py): full unittest
# suite + pipeline E2E + visual arbitration, WITHOUT external PDFs (gold
# tests on the real corpus skip themselves when the files are absent).
on:
  push:
    branches: [main, fixes-layout]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: harness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      # `main.py` imports PyQt6 at module level (the pure helpers used by the
      # tests live there); run the GUI framework headless.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries (Qt, headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run harness (app + workflow)
        run: python tools/harness.py --out "$RUNNER_TEMP/harness"

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: ${{ runner.temp }}/harness/harness_report.*
          if-no-files-found: warn
